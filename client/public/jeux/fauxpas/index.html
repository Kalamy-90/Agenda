<title>Faux Pas</title>
<style>
/* Faux Pas — interface pensée d'abord pour tablette : grosses cibles, texte lisible. */
:root {
  --night: #170f2b;
  --plum: #2c1c45;
  --plum-2: #3f2758;
  --cream: #fff3dd;
  --cream-dim: rgba(255, 243, 221, .68);
  --sand: #efe2c8;
  --mint: #5ee8c5;
  --mint-ink: #0f4a3e;
  --coral: #ff5d73;
  --sun: #ffd166;
  --glass: rgba(23, 15, 43, .55);
  --font: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night); color: var(--cream); font-family: var(--font);
  overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
kbd { font: 700 .85em var(--font); padding: 1px 7px; border-radius: 6px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); }

/* ---------- HUD ---------- */
#hud {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: calc(var(--st) + 12px) calc(var(--sr) + 14px) 0 calc(var(--sl) + 14px);
}
.hud-side { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  pointer-events: auto; width: 58px; height: 58px; border-radius: 16px; border: 0;
  background: var(--glass); color: var(--cream); display: grid; place-items: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.icon-btn svg { width: 26px; height: 26px; }
.icon-btn:active { transform: scale(.94); }
.hud-level { display: flex; align-items: baseline; gap: 10px; background: var(--glass); padding: 10px 16px; border-radius: 14px; }
#hud-num { font-weight: 900; font-size: 22px; color: var(--sun); }
#hud-name { font-weight: 600; font-size: 17px; }
.deaths { display: flex; align-items: center; gap: 8px; background: var(--glass); padding: 10px 16px; border-radius: 14px; font-size: 22px; font-variant-numeric: tabular-nums; }
.deaths svg { width: 22px; height: 22px; color: var(--coral); }
.deaths.bump { animation: bump .35s ease-out; }
@keyframes bump { 30% { transform: scale(1.25); } }

#btn-full .fs-out { display: none; }
#btn-full.on .fs-in { display: none; }
#btn-full.on .fs-out { display: inline; }

/* Appareil tactile tenu à la verticale : le jeu (16:9) y serait minuscule. */
#rotate {
  position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 22px;
  background: var(--night); text-align: center; font-size: 22px; font-weight: 700;
}
#rotate small { font-weight: 500; font-size: 16px; color: var(--cream-dim); }
.rotate-ico {
  width: 64px; height: 104px; border: 5px solid var(--cream); border-radius: 14px;
  animation: turn 2.2s ease-in-out infinite;
}
@keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }

/* ---------- Commandes tactiles ---------- */
#touch { position: fixed; inset: 0; pointer-events: none; }
.pad { position: absolute; bottom: calc(var(--sb) + 18px); display: flex; gap: 16px; align-items: flex-end; }
.pad-left { left: calc(var(--sl) + 18px); }
.pad-right { right: calc(var(--sr) + 18px); }
.tbtn {
  pointer-events: auto; touch-action: none; width: 104px; height: 104px; border-radius: 26px;
  border: 2px solid rgba(255, 243, 221, .35); background: rgba(23, 15, 43, .38); color: var(--cream);
  display: grid; place-items: center; transition: transform .05s, background .05s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.tbtn svg { width: 44px; height: 44px; }
.tbtn.jump { width: 128px; height: 128px; border-radius: 50%; }
.tbtn.jump svg { width: 52px; height: 52px; }
.tbtn.on { background: rgba(255, 209, 102, .85); color: var(--night); border-color: var(--sun); transform: scale(.95); }

/* ---------- Messages ---------- */
#say {
  position: fixed; left: 50%; top: calc(var(--st) + 86px); transform: translate(-50%, -8px);
  max-width: min(90vw, 640px); text-align: center; padding: 12px 22px; border-radius: 16px;
  background: var(--cream); color: var(--night); font-weight: 800; font-size: clamp(18px, 2.6vw, 24px);
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
}
#say.show { opacity: 1; transform: translate(-50%, 0); }
#card { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; }
#card.show { animation: card 1.9s ease-out forwards; }
#card-num { font-weight: 800; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--sun); }
#card-name { font-weight: 900; font-size: clamp(40px, 7vw, 72px); letter-spacing: -.02em; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
@keyframes card { 0% { opacity: 0; transform: translateY(12px); } 15%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
#fade { position: fixed; inset: 0; background: var(--night); opacity: 0; pointer-events: none; }
#fade.go { animation: fade .45s ease-out; }
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }

/* ---------- Écrans ---------- */
.screen {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; touch-action: pan-y;
  padding: calc(var(--st) + 20px) calc(var(--sr) + 16px) calc(var(--sb) + 20px) calc(var(--sl) + 16px);
  background: radial-gradient(ellipse at 50% 30%, rgba(63, 39, 88, .55), rgba(23, 15, 43, .88));
}
.screen.overlay { background: rgba(14, 8, 28, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.title-wrap { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.logo { margin: 0; font-weight: 900; font-size: clamp(76px, 15vw, 150px); line-height: .82; letter-spacing: -.05em; }
.logo span { display: block; }
.logo span:last-child { color: var(--sun); }
.logo i { display: inline-block; font-style: normal; transform: rotate(14deg) translateY(.08em); transform-origin: 30% 90%; animation: wobble 3.2s ease-in-out infinite; }
@keyframes wobble { 0%, 70%, 100% { transform: rotate(14deg) translateY(.08em); } 80% { transform: rotate(24deg) translateY(.12em); } 90% { transform: rotate(8deg) translateY(.06em); } }
.tagline { margin: 0; font-size: clamp(18px, 2.4vw, 22px); color: var(--cream-dim); font-weight: 600; }
.menu { display: flex; flex-direction: column; gap: 12px; width: min(340px, 84vw); }
.btn {
  min-height: 64px; border-radius: 18px; border: 0; padding: 0 26px; font-weight: 800; font-size: 21px;
  background: rgba(255, 243, 221, .1); color: var(--cream); box-shadow: inset 0 0 0 2px rgba(255, 243, 221, .18);
}
.btn:active { transform: translateY(2px); }
.btn.primary { background: var(--mint); color: var(--mint-ink); box-shadow: 0 6px 0 #2fae8f; }
.btn.primary:active { box-shadow: 0 3px 0 #2fae8f; }
.toggles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip { min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: rgba(255,255,255,.08); font-weight: 700; font-size: 16px; }
.chip[aria-pressed="false"] { color: var(--cream-dim); }
.progress { margin: 0; color: var(--sun); font-weight: 700; font-size: 17px; }
.keys { margin: 0; color: var(--cream-dim); font-size: 15px; }
@media (pointer: coarse) { .keys { display: none; } }

.panel {
  width: min(520px, 100%); background: var(--plum); border-radius: 26px; padding: 28px 26px;
  display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
  box-shadow: 0 30px 80px -30px rgba(0,0,0,.7), inset 0 0 0 2px rgba(255,255,255,.05);
}
.panel .menu { width: 100%; }
.panel.wide { width: min(980px, 100%); align-items: stretch; }
.panel h2 { margin: 0; font-weight: 900; font-size: clamp(34px, 5vw, 46px); letter-spacing: -.02em; }
.panel-head { display: flex; align-items: center; gap: 16px; }
.panel-head h2 { flex: 1; text-align: left; }
.muted { margin: 0; color: var(--cream-dim); font-size: 17px; font-weight: 600; }

/* Écran Sauvegarde */
.save-panel { width: min(620px, 100%); align-items: stretch; text-align: left; }
.save-label { font-weight: 800; font-size: 18px; margin-top: 6px; }
.save-box {
  width: 100%; resize: none; padding: 12px 14px; border-radius: 14px; border: 2px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.25); color: var(--cream); font: 600 15px/1.4 ui-monospace, Consolas, monospace;
  word-break: break-all; -webkit-user-select: text; user-select: text; touch-action: auto;
}
.save-box:focus { outline: 3px solid var(--mint); outline-offset: 2px; }
.save-msg { margin: 0; min-height: 1.4em; font-weight: 700; }
#admin-login, #admin-tools { display: flex; flex-direction: column; gap: 12px; }
.admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.chip-admin, .admin-grid .chip[aria-pressed="true"] { background: rgba(255, 209, 102, .2); color: var(--sun); }
.hud-admin { background: var(--sun); color: var(--night); font-weight: 900; font-size: 13px; letter-spacing: .08em; padding: 6px 10px; border-radius: 10px; }
.save-msg.ok { color: var(--mint); } .save-msg.ko { color: var(--coral); }
.eyebrow { margin: 0; color: var(--sun); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 14px; }
.quip { margin: 0; font-size: 19px; font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.stats.single { grid-template-columns: 1fr; }
.stats div { background: rgba(0,0,0,.2); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; }
.stats b { font-size: 44px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stats span { color: var(--cream-dim); font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.level-btn {
  min-height: 118px; border-radius: 20px; border: 0; padding: 14px; text-align: left;
  background: var(--plum-2); display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.05);
}
.level-btn .lv-num { font-size: 34px; font-weight: 900; line-height: 1; }
.level-btn .lv-name { font-weight: 700; font-size: 16px; }
.level-btn .lv-rec { font-size: 14px; color: var(--cream-dim); font-weight: 700; min-height: 1em; }
.level-btn.done { background: #2f5b57; }
.level-btn.done .lv-num { color: var(--mint); }
.level-btn.boss { box-shadow: inset 0 0 0 3px var(--coral); }
.level-btn.mini { box-shadow: inset 0 0 0 3px var(--sun); }
.level-btn.boss .lv-rec { color: var(--coral); }
.level-btn.mini .lv-rec { color: var(--sun); }
.level-btn:disabled { opacity: .45; cursor: not-allowed; }
.level-btn:not(:disabled):active { transform: scale(.97); }

/* Petits écrans (téléphone) */
@media (max-width: 700px), (max-height: 500px) {
  .icon-btn { width: 50px; height: 50px; border-radius: 14px; }
  .hud-level { padding: 8px 12px; } #hud-name { display: none; }
  .deaths { padding: 8px 12px; font-size: 19px; }
  .tbtn { width: 84px; height: 84px; border-radius: 22px; }
  .tbtn.jump { width: 104px; height: 104px; }
  .tbtn svg { width: 36px; height: 36px; }
  .pad { gap: 12px; bottom: calc(var(--sb) + 12px); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .level-btn { min-height: 100px; }
  #say { top: calc(var(--st) + 70px); }
}
@media (max-height: 500px) {
  .logo { font-size: 64px; }
  .title-wrap { gap: 10px; }
  .btn { min-height: 54px; }
}
@media (prefers-reduced-motion: reduce) {
  .logo i, #card.show, .deaths.bump, #fade.go, .rotate-ico { animation: none; }
  #card.show { opacity: 1; }
}

</style>
</head>
<body>
<canvas id="game" aria-label="Zone de jeu"></canvas>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-side">
    <button class="icon-btn" id="btn-pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
    </button>
    <div class="hud-level"><span id="hud-num">1</span><span id="hud-name"></span></div>
    <span class="hud-admin" id="hud-admin" hidden>ADMIN</span>
  </div>
  <div class="hud-side">
    <div class="deaths" id="hud-deaths" title="Morts sur ce niveau">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 2 3.5 5.6 3.5 10.3c0 2.8 1.3 4.8 3.2 6v2.9c0 .9.7 1.6 1.6 1.6h7.4c.9 0 1.6-.7 1.6-1.6v-2.9c1.9-1.2 3.2-3.2 3.2-6C20.5 5.6 17 2 12 2zm-3.3 11.2a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm6.6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
      <b id="hud-deaths-n">0</b>
    </div>
    <button class="icon-btn" id="btn-full" aria-label="Plein écran (F)" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <button class="icon-btn" id="btn-restart" aria-label="Recommencer (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
    </button>
  </div>
</div>

<!-- Commandes tactiles -->
<div id="touch" hidden>
  <div class="pad pad-left">
    <button class="tbtn" data-act="left" aria-label="Gauche"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4.5 6.5 12l9 7.5z"/></svg></button>
    <button class="tbtn" data-act="right" aria-label="Droite"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4.5 17.5 12l-9 7.5z"/></svg></button>
  </div>
  <div class="pad pad-right">
    <button class="tbtn jump" data-act="jump" aria-label="Saut"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5 4.5 14h5v5.5h5V14h5z"/></svg></button>
  </div>
</div>

<div id="say" aria-live="polite"></div>
<div id="rotate" hidden><div class="rotate-ico"></div><p>Tourne ton appareil<br><small>Le jeu se joue à l’horizontale.</small></p></div>
<div id="card"><div id="card-num"></div><div id="card-name"></div></div>

<!-- Écran titre -->
<section class="screen" id="scr-title" hidden>
  <div class="title-wrap">
    <h1 class="logo" aria-label="Faux Pas"><span>FAUX</span><span>P<i>A</i>S</span></h1>
    <p class="tagline">Le sol ment. Les portes aussi.</p>
    <div class="menu">
      <button class="btn primary" id="btn-play">Jouer</button>
      <button class="btn" id="btn-levels">Niveaux</button>
    </div>
    <div class="toggles">
      <button class="chip" data-toggle="sfx"></button>
      <button class="chip" data-toggle="music"></button>
      <button class="chip" data-toggle="touch"></button>
      <button class="chip" data-full hidden>Plein écran</button>
      <button class="chip chip-admin" data-admin hidden>Admin</button>
    </div>
    <p class="progress" id="title-progress"></p>
    <p class="keys">Clavier : <kbd>←</kbd> <kbd>→</kbd> bouger · <kbd>Espace</kbd> sauter · <kbd>R</kbd> recommencer · <kbd>Échap</kbd> pause</p>
  </div>
</section>

<!-- Sélection des niveaux -->
<section class="screen" id="scr-levels" hidden>
  <div class="panel wide">
    <div class="panel-head">
      <button class="icon-btn" id="btn-levels-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Niveaux</h2>
      <span class="muted" id="levels-progress"></span>
      <button class="chip" id="btn-save">Sauvegarde</button>
    </div>
    <div class="grid" id="level-grid"></div>
  </div>
</section>

<!-- Mode admin (propriétaire du jeu) -->
<section class="screen" id="scr-admin" hidden>
  <div class="panel save-panel">
    <div class="panel-head">
      <button class="icon-btn" id="btn-admin-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Admin</h2>
    </div>
    <div id="admin-login">
      <label class="save-label" for="admin-code">Code admin</label>
      <input id="admin-code" class="save-box" type="password" autocomplete="off" spellcheck="false">
      <button class="btn primary" id="btn-admin-login">Déverrouiller</button>
    </div>
    <div id="admin-tools" hidden>
      <p class="muted" id="admin-who"></p>
      <div class="admin-grid">
        <button class="chip" data-admin-toggle="unlockAll"></button>
        <button class="chip" data-admin-toggle="god"></button>
        <button class="chip" data-admin-toggle="slow"></button>
        <button class="chip" data-admin-toggle="hitbox"></button>
      </div>
      <button class="btn primary" id="btn-admin-skip">Passer ce niveau</button>
      <button class="btn" id="btn-admin-reset">Effacer la progression</button>
      <button class="btn" id="btn-admin-lock">Verrouiller le mode admin</button>
    </div>
    <p class="save-msg" id="admin-msg" aria-live="polite"></p>
  </div>
</section>

<!-- Sauvegarde : code à copier / coller -->
<section class="screen" id="scr-save" hidden>
  <div class="panel save-panel">
    <div class="panel-head">
      <button class="icon-btn" id="btn-save-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Sauvegarde</h2>
    </div>
    <p class="muted" id="save-where"></p>
    <label class="save-label" for="save-code">Ton code de sauvegarde</label>
    <textarea id="save-code" class="save-box" rows="3" readonly spellcheck="false"></textarea>
    <button class="btn primary" id="btn-save-copy">Copier le code</button>
    <label class="save-label" for="save-input">Récupérer une progression</label>
    <textarea id="save-input" class="save-box" rows="3" spellcheck="false" placeholder="Colle ici un code qui commence par FP1-"></textarea>
    <button class="btn" id="btn-save-load">Charger ce code</button>
    <p class="save-msg" id="save-msg" aria-live="polite"></p>
  </div>
</section>

<!-- Pause -->
<section class="screen overlay" id="scr-pause" hidden>
  <div class="panel">
    <h2>Pause</h2>
    <p class="muted" id="pause-info"></p>
    <div class="menu">
      <button class="btn primary" id="btn-resume">Reprendre</button>
      <button class="btn" id="btn-pause-restart">Recommencer</button>
      <button class="btn" id="btn-pause-levels">Niveaux</button>
      <button class="btn" id="btn-pause-title">Menu principal</button>
    </div>
    <div class="toggles">
      <button class="chip" data-toggle="sfx"></button>
      <button class="chip" data-toggle="music"></button>
      <button class="chip" data-toggle="touch"></button>
      <button class="chip" data-full hidden>Plein écran</button>

      this.adminMsg('Toute la progression de cet appareil (et du compte) sera effacée.', 'ko');
      return;
    }
    this.g.save.reset();
    this.renderAdmin();
    this.adminMsg('Progression effacée.', 'ok');
  }

  // Pastilles « Admin », badge du HUD, écran admin ouvert.
  refreshAdmin() {
    const a = this.g.admin;
    for (const b of document.querySelectorAll('[data-admin]')) b.hidden = !a.on;
    $('hud-admin').hidden = !a.active;
    if (this.current === 'admin') this.renderAdmin();
  }

  // ---- Sauvegarde ----
  openSave() {
    $('save-where').textContent = this.g.save.where();
    $('save-code').value = this.g.save.exportCode();
    $('save-input').value = '';
    this.saveMsg('', '');
    this.show('save');
  }

  saveMsg(text, kind) { const m = $('save-msg'); m.textContent = text; m.className = 'save-msg' + (kind ? ' ' + kind : ''); }

  async copyCode() {
    const box = $('save-code');
    box.focus(); box.select();
    let ok = false;
    try { await navigator.clipboard.writeText(box.value); ok = true; } catch (e) {
      try { ok = document.execCommand('copy'); } catch (e2) { /* ignore */ }
    }
    this.saveMsg(ok ? 'Code copié. Garde-le (note, message à toi-même…).' : 'Copie bloquée ici : le code est sélectionné, copie-le à la main.', ok ? 'ok' : '');
  }

  loadCode() {
    const code = $('save-input').value.trim();
    if (!code) { this.saveMsg('Colle d’abord un code.', 'ko'); return; }
    try {
      const n = this.g.save.importCode(code);
      $('save-code').value = this.g.save.exportCode();
      $('save-input').value = '';
      this.saveMsg(n ? `Progression récupérée : ${n} niveau${n > 1 ? 'x' : ''} en plus.` : 'Code valide, mais il n’apporte rien de plus que ta progression actuelle.', 'ok');
    } catch (e) {
      this.saveMsg('Code invalide ou mal recopié.', 'ko');
    }
  }

  // Appelé quand la progression a grandi en arrière-plan (compte claude.ai) : on rafraîchit l'écran ouvert.
  refreshProgress() {
    if (this.current === 'title') this.openTitle();
    else if (this.current === 'levels') this.openLevels();
    else if (this.current === 'save') $('save-code').value = this.g.save.exportCode();
  }

  hud(visible) {
    $('hud').hidden = !visible;
    this.touch(visible);
  }

  touch(visible) {
    const mode = this.g.save.settings.touch;
    $('touch').hidden = !visible || mode === 'off' || (mode === 'auto' && !touchPrimary() && !this.sawTouch);
    this.touchVisible = !$('touch').hidden;
  }

  updateHud() {
    const g = this.g, def = g.levels[g.index];
    $('hud-num').textContent = g.index + 1;
    $('hud-name').textContent = def.name;
    $('hud-deaths-n').textContent = g.levelDeaths;
  }

  bumpDeaths() {
    const el = $('hud-deaths');
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  card(i, def) {
    $('card-num').textContent = `Niveau ${i + 1}` + (def.boss ? ' · Boss' : def.miniboss ? ' · Mini-boss' : '');
    $('card-name').textContent = def.name;
    const el = $('card');
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }

  say(msg, time = 2.2) {
    const el = $('say');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this.sayT);
    this.sayT = setTimeout(() => el.classList.remove('show'), time * 1000);
  }

  clearSay() { clearTimeout(this.sayT); $('say').classList.remove('show'); }

  showPause() {
    const g = this.g;
    $('pause-info').textContent = `Niveau ${g.index + 1} · ${g.levels[g.index].name} — ${g.levelDeaths} mort${g.levelDeaths > 1 ? 's' : ''}`;
    this.show('pause');
  }

  showWin(stats) {
    const g = this.g, last = g.index >= g.levels.length - 1;
    $('win-level').textContent = `Niveau ${g.index + 1} · ${g.levels[g.index].name}`;
    $('win-deaths').textContent = stats.deaths;
    $('win-time').textContent = fmtTime(stats.time);
    $('win-quip').textContent = QUIPS.find(q => stats.deaths <= q[0])[1];
    $('win-best').textContent = stats.record ? 'Nouveau record de morts minimales !' : '';
    $('btn-next').textContent = last ? 'Terminer' : 'Niveau suivant';
    this.show('win');
  }

  showEnd() {
    const g = this.g;
    $('end-deaths').textContent = g.save.data.totalDeaths;
    this.show('end');
  }

  refreshToggles() {
    const s = this.g.save.settings;
    const label = { sfx: v => `Sons : ${v ? 'oui' : 'non'}`, music: v => `Musique : ${v ? 'oui' : 'non'}`, touch: v => `Boutons tactiles : ${{ auto: 'auto', on: 'oui', off: 'non' }[v]}` };
    for (const b of document.querySelectorAll('[data-toggle]')) {
      const k = b.dataset.toggle;
      b.textContent = label[k](s[k]);
      b.setAttribute('aria-pressed', String(s[k] === true || s[k] === 'on'));
    }
  }

  fade() {
    const el = $('fade');
    el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s - m * 60;
  return `${m}:${r < 10 ? '0' : ''}${r.toFixed(1)}`;
}

return { UI, fmtTime };
};
